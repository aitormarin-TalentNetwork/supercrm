<!-- @dsCard group="SuperCRM" viewport="1280x820" -->
<!-- @startingPoint section="SuperCRM" subtitle="Dashboard de pipeline con sidebar, KPIs, kanban y tabla" viewport="1280x820" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperCRM — Pipeline</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--color-bg); color:var(--color-text); }
  svg.lucide { width:18px; height:18px; }
  .app { display:flex; min-height:100vh; }
  .sidebar { width:240px; flex:none; background:var(--color-surface); border-right:1px solid var(--color-border); display:flex; flex-direction:column; padding:16px 12px; }
  .main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar { height:64px; flex:none; border-bottom:1px solid var(--color-border); background:var(--color-surface); display:flex; align-items:center; gap:16px; padding:0 24px; }
  .content { padding:24px; flex:1; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px; }
  .board { display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; height:430px; }
  .mark { width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#3B82F6,#2563EB 55%,#6366F1);display:flex;align-items:center;justify-content:center;flex:none }
  @media (max-width:900px){ .kpis{grid-template-columns:repeat(2,1fr)} .sidebar{display:none} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function findNS(){
  for (const k of Object.keys(window)) {
    const v = window[k];
    if (v && typeof v === 'object' && typeof v.SidebarNav === 'function' && typeof v.KanbanColumn === 'function') return v;
  }
  return window;
}
const DS = findNS();
const { SidebarNav, Tabs, Table, StatusBadge, Avatar, Button, IconButton, Card, KanbanColumn, Input, Dialog, ProgressBar, Breadcrumb } = DS;
const Ic = (n) => <i data-lucide={n}></i>;

const DEALS = [
  { id:1, name:'Estudio Ríos',  contact:'María Ríos',  stage:'propuesta',   value:12400, risk:'medium' },
  { id:2, name:'Lema & Co',     contact:'Jorge Lema',  stage:'ganado',      value:8900,  risk:'low' },
  { id:3, name:'Soto Diseño',   contact:'Ana Soto',    stage:'negociacion', value:21000, risk:'high' },
  { id:4, name:'Vidal Tech',    contact:'Pau Vidal',   stage:'contactado',  value:4300,  risk:'low' },
  { id:5, name:'Marca Verde',   contact:'Lucía Gil',   stage:'nuevo',       value:6800,  risk:'medium' },
  { id:6, name:'Café Aroma',    contact:'Iván Mora',   stage:'propuesta',   value:3200,  risk:'low' },
  { id:7, name:'Nordic Studio', contact:'Eva Ruiz',    stage:'negociacion', value:15600, risk:'medium' },
];
const STAGES = [
  { key:'nuevo', label:'Nuevo' },
  { key:'contactado', label:'Contactado' },
  { key:'propuesta', label:'Propuesta' },
  { key:'negociacion', label:'Negociación' },
  { key:'ganado', label:'Ganado' },
];
const eur = (n) => '€' + n.toLocaleString('es-ES');

function Kpi({ label, value, sub, icon, accent }){
  return (
    <Card padding="md">
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <span style={{ fontSize:13, fontWeight:600, color:'var(--color-text-muted)' }}>{label}</span>
        <span style={{ width:30,height:30,borderRadius:8,display:'inline-flex',alignItems:'center',justifyContent:'center',background:accent.bg,color:accent.fg }}>{icon}</span>
      </div>
      <div style={{ fontSize:28, fontWeight:700, marginTop:10, letterSpacing:'-.01em' }}>{value}</div>
      <div style={{ fontSize:12.5, color:'var(--color-text-muted)', marginTop:2 }}>{sub}</div>
    </Card>
  );
}

function DealCard({ d }){
  return (
    <Card padding="sm" interactive>
      <div style={{ display:'flex', justifyContent:'space-between', gap:8 }}>
        <span style={{ fontWeight:600, fontSize:13.5 }}>{d.name}</span>
        <StatusBadge kind="risk" value={d.risk} dot={true} label={d.risk==='high'?'Alto':d.risk==='medium'?'Medio':'Bajo'} />
      </div>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginTop:10 }}>
        <span style={{ display:'flex', alignItems:'center', gap:7 }}>
          <Avatar name={d.contact} size="xs" />
          <span style={{ fontSize:12, color:'var(--color-text-muted)' }}>{d.contact}</span>
        </span>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:12.5, fontWeight:500 }}>{eur(d.value)}</span>
      </div>
    </Card>
  );
}

function App(){
  const [view, setView] = React.useState('pipeline');
  const [tab, setTab] = React.useState('tablero');
  const [open, setOpen] = React.useState(false);

  React.useEffect(() => { window.lucide && window.lucide.createIcons(); });

  const totalOpen = DEALS.filter(d=>d.stage!=='ganado'&&d.stage!=='perdido').reduce((s,d)=>s+d.value,0);
  const won = DEALS.filter(d=>d.stage==='ganado').reduce((s,d)=>s+d.value,0);

  return (
    <div className="app">
      <aside className="sidebar">
        <div style={{ display:'flex', alignItems:'center', gap:10, padding:'6px 8px 18px' }}>
          <span className="mark"><svg width="17" height="17" viewBox="0 0 24 24" fill="#fff"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>
          <span style={{ fontWeight:700, fontSize:16, letterSpacing:'-.01em' }}>SuperCRM</span>
        </div>
        <SidebarNav value={view} onChange={setView} items={[
          { value:'inicio', label:'Inicio', icon:Ic('layout-dashboard') },
          { value:'contactos', label:'Contactos', icon:Ic('users') },
          { value:'pipeline', label:'Pipeline', icon:Ic('trending-up') },
          { value:'tareas', label:'Tareas', icon:Ic('check-circle-2'), badge:3 },
          { value:'presupuestos', label:'Presupuestos', icon:Ic('file-text') },
          { value:'ajustes', label:'Ajustes', icon:Ic('settings') },
        ]} />
        <div style={{ marginTop:'auto', display:'flex', alignItems:'center', gap:10, padding:'10px 8px', borderTop:'1px solid var(--color-border)' }}>
          <Avatar name="Marta Ledo" size="sm" />
          <div style={{ minWidth:0 }}>
            <div style={{ fontSize:13, fontWeight:600, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>Marta Ledo</div>
            <div style={{ fontSize:11.5, color:'var(--color-text-muted)' }}>Directora</div>
          </div>
        </div>
      </aside>

      <div className="main">
        <header className="topbar">
          <div style={{ flex:1, maxWidth:360 }}>
            <Input leftIcon={Ic('search')} placeholder="Buscar contactos, tratos…" size="sm" aria-label="Buscar" />
          </div>
          <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:10 }}>
            <IconButton variant="ghost" aria-label="Notificaciones">{Ic('bell')}</IconButton>
            <Button leftIcon={Ic('plus')} onClick={()=>setOpen(true)}>Nuevo trato</Button>
          </div>
        </header>

        <main className="content">
          <Breadcrumb items={[{ label:'Pipeline', href:'#' }, { label:'Todos los tratos' }]} />
          <h1 style={{ fontSize:28, fontWeight:700, letterSpacing:'-.015em', margin:'10px 0 4px' }}>Pipeline de ventas</h1>
          <p style={{ margin:'0 0 22px', color:'var(--color-text-secondary)', fontSize:15 }}>7 tratos abiertos · no pierdas ningún seguimiento.</p>

          <div className="kpis">
            <Kpi label="Pipeline abierto" value={eur(totalOpen)} sub="7 tratos activos" icon={Ic('trending-up')} accent={{bg:'#EFF4FF',fg:'#2563EB'}} />
            <Kpi label="Ganado (mes)" value={eur(won)} sub="+18,4% vs anterior" icon={Ic('check')} accent={{bg:'#DCFCE7',fg:'#16A34A'}} />
            <Kpi label="Tareas hoy" value="3" sub="1 vencida" icon={Ic('check-circle-2')} accent={{bg:'#FEF3C7',fg:'#D97706'}} />
            <Kpi label="En riesgo" value="2" sub="Sin seguir +5 días" icon={Ic('alert-triangle')} accent={{bg:'#FEE2E2',fg:'#DC2626'}} />
          </div>

          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14 }}>
            <Tabs value={tab} onChange={setTab} items={[
              { value:'tablero', label:'Tablero', icon:Ic('columns-3') },
              { value:'lista', label:'Lista', icon:Ic('list'), count:7 },
            ]} />
            <Button variant="secondary" size="sm" leftIcon={Ic('filter')}>Filtrar</Button>
          </div>

          {tab==='tablero' ? (
            <div className="board">
              {STAGES.map(s => {
                const items = DEALS.filter(d=>d.stage===s.key);
                const total = items.reduce((a,d)=>a+d.value,0);
                return (
                  <KanbanColumn key={s.key} stage={s.key} title={s.label} count={items.length} total={total?eur(total):'€0'}>
                    {items.map(d => <DealCard key={d.id} d={d} />)}
                  </KanbanColumn>
                );
              })}
            </div>
          ) : (
            <Table
              rows={DEALS}
              onRowClick={()=>{}}
              columns={[
                { key:'name', header:'Trato', width:2, render:(v,r)=>(
                  <span style={{ display:'flex', alignItems:'center', gap:9, minWidth:0 }}>
                    <Avatar name={r.contact} size="sm" />
                    <span style={{ minWidth:0 }}>
                      <span style={{ display:'block', fontWeight:600, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{v}</span>
                      <span style={{ display:'block', fontSize:12, color:'var(--color-text-muted)' }}>{r.contact}</span>
                    </span>
                  </span>
                )},
                { key:'stage', header:'Etapa', width:1.3, render:v=><StatusBadge kind="pipeline" value={v} /> },
                { key:'risk', header:'Riesgo', width:1, render:v=><StatusBadge kind="risk" value={v} label={v==='high'?'Alto':v==='medium'?'Medio':'Bajo'} /> },
                { key:'value', header:'Valor', align:'right', mono:true, render:v=>eur(v) },
              ]}
            />
          )}
        </main>
      </div>

      <Dialog
        open={open}
        onClose={()=>setOpen(false)}
        title="Nuevo trato"
        description="Registra una oportunidad para no perderle el seguimiento."
        footer={<>
          <Button variant="secondary" onClick={()=>setOpen(false)}>Cancelar</Button>
          <Button onClick={()=>setOpen(false)}>Crear trato</Button>
        </>}
      >
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          <Input label="Nombre del trato" placeholder="p.ej. Estudio Ríos — web" required />
          <div style={{ display:'flex', gap:12 }}>
            <Input label="Valor (€)" leftIcon={Ic('euro')} placeholder="0,00" style={{ flex:1 }} />
            <div style={{ flex:1 }}>
              <label style={{ display:'block', fontSize:13, fontWeight:600, color:'var(--color-text-secondary)', marginBottom:6 }}>Etapa</label>
              <select style={{ width:'100%', height:44, padding:'0 12px', border:'1px solid var(--color-border)', borderRadius:'var(--radius-md)', fontFamily:'var(--font-sans)', fontSize:14, background:'#fff' }}>
                <option>Nuevo</option><option>Contactado</option><option>Propuesta</option>
              </select>
            </div>
          </div>
        </div>
      </Dialog>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
setTimeout(() => window.lucide && window.lucide.createIcons(), 80);
</script>
</body>
</html>
