<!-- @dsCard group="Colors" viewport="700x150" name="Marca y acción" subtitle="Primario azul + secundario teal" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--color-surface);padding:16px;color:var(--color-text)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:150px}
.chip{height:54px;border-radius:var(--radius-md);border:1px solid rgba(15,23,42,.08)}
.nm{font-size:12px;font-weight:600;margin-top:8px}
.hx{font-family:var(--font-mono);font-size:11px;color:var(--color-text-muted)}
.mini{display:flex;gap:4px;margin-top:6px}
.mini span{flex:1;height:16px;border-radius:4px}</style></head>
<body><div class="row">
  <div class="sw"><div class="chip" style="background:var(--color-primary)"></div><div class="nm">Primario</div><div class="hx">#2563EB</div>
    <div class="mini"><span style="background:var(--color-primary-subtle)"></span><span style="background:var(--color-primary-hover)"></span><span style="background:var(--color-primary-active)"></span></div></div>
  <div class="sw"><div class="chip" style="background:var(--color-secondary)"></div><div class="nm">Secundario</div><div class="hx">#0D9488</div>
    <div class="mini"><span style="background:var(--color-secondary-subtle)"></span><span style="background:var(--color-secondary-hover)"></span><span style="background:var(--color-secondary-active)"></span></div></div>
  <div class="sw"><div class="chip" style="background:var(--color-primary-subtle)"></div><div class="nm">Primario subtle</div><div class="hx">#EFF4FF</div></div>
  <div class="sw"><div class="chip" style="background:var(--color-secondary-subtle)"></div><div class="nm">Secundario subtle</div><div class="hx">#ECFDF5</div></div>
</div></body></html>
