<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--color-surface);padding:16px;color:var(--color-text)}
.row{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.c{text-align:center}
.b{width:60px;height:60px;background:var(--color-primary-subtle);border:1.5px solid var(--color-primary)}
.l{font-family:var(--font-mono);font-size:10px;color:var(--color-text-muted);margin-top:8px}</style></head>
<body><div class="row">
  <div class="c"><div class="b" style="border-radius:var(--radius-sm)"></div><div class="l">sm·6</div></div>
  <div class="c"><div class="b" style="border-radius:var(--radius-md)"></div><div class="l">md·8</div></div>
  <div class="c"><div class="b" style="border-radius:var(--radius-lg)"></div><div class="l">lg·12</div></div>
  <div class="c"><div class="b" style="border-radius:var(--radius-xl)"></div><div class="l">xl·16</div></div>
  <div class="c"><div class="b" style="border-radius:var(--radius-pill)"></div><div class="l">pill</div></div>
</div></body></html>
