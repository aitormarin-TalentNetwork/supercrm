<!-- @dsCard group="Spacing" viewport="700x130" name="Escala de espaciado" subtitle="Base 4 (saltos de 8 desde 16)" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--color-surface);padding:16px;color:var(--color-text)}
.row{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.c{text-align:center}
.b{background:var(--color-primary);border-radius:4px;margin:0 auto}
.l{font-family:var(--font-mono);font-size:10px;color:var(--color-text-muted);margin-top:8px}</style></head>
<body><div class="row">
  <div class="c"><div class="b" style="width:var(--space-1);height:var(--space-1)"></div><div class="l">1·4</div></div>
  <div class="c"><div class="b" style="width:var(--space-2);height:var(--space-2)"></div><div class="l">2·8</div></div>
  <div class="c"><div class="b" style="width:var(--space-3);height:var(--space-3)"></div><div class="l">3·12</div></div>
  <div class="c"><div class="b" style="width:var(--space-4);height:var(--space-4)"></div><div class="l">4·16</div></div>
  <div class="c"><div class="b" style="width:var(--space-5);height:var(--space-5)"></div><div class="l">5·20</div></div>
  <div class="c"><div class="b" style="width:var(--space-6);height:var(--space-6)"></div><div class="l">6·24</div></div>
  <div class="c"><div class="b" style="width:var(--space-8);height:var(--space-8)"></div><div class="l">8·32</div></div>
  <div class="c"><div class="b" style="width:var(--space-10);height:var(--space-10)"></div><div class="l">10·40</div></div>
  <div class="c"><div class="b" style="width:var(--space-12);height:var(--space-12)"></div><div class="l">12·48</div></div>
  <div class="c"><div class="b" style="width:var(--space-16);height:var(--space-16)"></div><div class="l">16·64</div></div>
</div></body></html>
