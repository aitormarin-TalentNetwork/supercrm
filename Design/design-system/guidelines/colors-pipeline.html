<!-- @dsCard group="Colors" viewport="700x120" name="Etapas del pipeline" subtitle="Frío → cálido → verde; perdido en rojo" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--color-surface);padding:16px;color:var(--color-text)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:7px 13px;border-radius:var(--radius-pill)}
.dot{width:9px;height:9px;border-radius:50%}</style></head>
<body><div class="row">
  <span class="chip" style="background:#F1F5F9;color:#475569"><span class="dot" style="background:var(--pipeline-nuevo)"></span>Nuevo</span>
  <span class="chip" style="background:#ECFEFF;color:#0E7490"><span class="dot" style="background:var(--pipeline-contactado)"></span>Contactado</span>
  <span class="chip" style="background:#EEF2FF;color:#4F46E5"><span class="dot" style="background:var(--pipeline-propuesta)"></span>Propuesta</span>
  <span class="chip" style="background:#FEF3C7;color:#B45309"><span class="dot" style="background:var(--pipeline-negociacion)"></span>Negociación</span>
  <span class="chip" style="background:#DCFCE7;color:#15803D"><span class="dot" style="background:var(--pipeline-ganado)"></span>Ganado</span>
  <span class="chip" style="background:#FEE2E2;color:#B91C1C"><span class="dot" style="background:var(--pipeline-perdido)"></span>Perdido</span>
</div></body></html>
