  <div class="p"><div class="n">03</div><div class="t">Confianza tranquila</div><div class="d">Orden y consistencia dan seguridad.</div></div>
  <div class="p"><div class="n">04</div><div class="t">Accesible por defecto</div><div class="d">AA, 44px, foco visible.</div></div>
