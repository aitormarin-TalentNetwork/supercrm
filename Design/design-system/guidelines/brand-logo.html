<!-- @dsCard group="Brand" viewport="700x150" name="Logo" subtitle="Marca con degradado + wordmark" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--color-surface);padding:20px;color:var(--color-text);display:flex;gap:36px;align-items:center;flex-wrap:wrap}
.mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#3B82F6,#2563EB 55%,#6366F1);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(37,99,235,.45)}
.lock{display:flex;align-items:center;gap:12px}
.wm{font-size:24px;font-weight:700;letter-spacing:-.02em}
.dark{background:#0F172A;border-radius:var(--radius-lg);padding:14px 18px;display:flex;align-items:center;gap:12px}
.dark .wm{color:#fff}</style></head>
<body>
<div class="lock">
  <div class="mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
  <span class="wm">SuperCRM</span>
</div>
<div class="dark">
  <div class="mark" style="width:34px;height:34px;border-radius:10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
  <span class="wm" style="font-size:20px">SuperCRM</span>
</div>
</body></html>
