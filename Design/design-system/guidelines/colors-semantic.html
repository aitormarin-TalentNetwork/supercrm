<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--color-surface);padding:16px;color:var(--color-text)}
.row{display:flex;gap:12px}
.s{flex:1}
.s .b{height:44px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
.s .t{font-size:12px;font-weight:600;margin-top:8px}
.s .h{font-family:var(--font-mono);font-size:11px;color:var(--color-text-muted)}
.s .sub{height:14px;border-radius:4px;margin-top:6px}</style></head>
<body><div class="row">
  <div class="s"><div class="b" style="background:var(--color-success)"></div><div class="t">Éxito</div><div class="h">#16A34A</div><div class="sub" style="background:var(--color-success-subtle)"></div></div>
  <div class="s"><div class="b" style="background:var(--color-warning)"></div><div class="t">Aviso</div><div class="h">#D97706</div><div class="sub" style="background:var(--color-warning-subtle)"></div></div>
  <div class="s"><div class="b" style="background:var(--color-error)"></div><div class="t">Error</div><div class="h">#DC2626</div><div class="sub" style="background:var(--color-error-subtle)"></div></div>
  <div class="s"><div class="b" style="background:var(--color-info)"></div><div class="t">Info</div><div class="h">#0284C7</div><div class="sub" style="background:var(--color-info-subtle)"></div></div>
</div></body></html>
