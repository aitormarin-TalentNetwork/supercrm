<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--color-surface);padding:16px;color:var(--color-text)}
.ramp{display:flex;gap:4px}
.c{flex:1}
.c .b{height:48px;border-radius:6px}
.c .l{font-family:var(--font-mono);font-size:9.5px;color:var(--color-text-muted);text-align:center;margin-top:6px}</style></head>
<body><div class="ramp">
  <div class="c"><div class="b" style="background:#FFFFFF;border:1px solid var(--color-border)"></div><div class="l">0</div></div>
  <div class="c"><div class="b" style="background:#F8FAFC;border:1px solid var(--color-border)"></div><div class="l">50</div></div>
  <div class="c"><div class="b" style="background:#F1F5F9"></div><div class="l">100</div></div>
  <div class="c"><div class="b" style="background:#E2E8F0"></div><div class="l">200</div></div>
  <div class="c"><div class="b" style="background:#CBD5E1"></div><div class="l">300</div></div>
  <div class="c"><div class="b" style="background:#94A3B8"></div><div class="l">400</div></div>
  <div class="c"><div class="b" style="background:#64748B"></div><div class="l">500</div></div>
  <div class="c"><div class="b" style="background:#475569"></div><div class="l">600</div></div>
  <div class="c"><div class="b" style="background:#334155"></div><div class="l">700</div></div>
  <div class="c"><div class="b" style="background:#1E293B"></div><div class="l">800</div></div>
  <div class="c"><div class="b" style="background:#0F172A"></div><div class="l">900</div></div>
  <div class="c"><div class="b" style="background:#020617"></div><div class="l">950</div></div>
</div></body></html>
